<div class="container d-flex justify-content-center">
    <div class="card w-50 p-2">
        <form class="">
            <p class="text-center fs-4 mb-3 fw-normal">Please Login</p>

            <div class="form-floating my-2">
                <input type="email" class="form-control" id="email" name="email" [(ngModel)]="email" placeholder="name@example.com">
                <label for="email">Email address</label>
            </div>
            <div class="form-floating my-2">
                <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password" placeholder="Password">
                <label for="password">Password</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit" (click)="login()">Login</button>
        </form>
    </div>
</div>
